#   Link:     https://docs.docker.com/reference/compose-file/merge/
#   Used for: layering build settings over docker-compose.yml with a second -f file.
#
# Local build override. docker-compose.yml only references Docker Hub images,
# which is what the VPS uses. Add this file when you want to build the images
# from the source in this repository instead:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The images are tagged with the same names as in docker-compose.yml, so
# "docker compose -f docker-compose.yml -f docker-compose.build.yml push"
# publishes them to Docker Hub.

services:
  functions:
    build:
      context: .
      dockerfile: Dockerfile

  gateway:
    build:
      context: ./CoffeeNChillGateway
      dockerfile: Dockerfile
