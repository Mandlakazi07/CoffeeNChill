# CODE ATTRIBUTION (IIE Harvard Anglia)
# Compose service, network and named-volume concepts follow Docker's documentation (Docker, n.d.-a; Docker, n.d.-b; Docker, n.d.-c).
# The specific services, image references, ports and storage connection are CoffeeNChill project configuration. See docs/CODE_ATTRIBUTION.md.
#
# Part 3 stack: Azurite + Azure Functions (Part 1/2) + the ASP.NET Core API gateway.
# Settings come from a .env file next to this one (copy .env.example). Images are
# pulled from Docker Hub; for a local build use docker-compose.build.yml as well
# (see docs/part3-docker-and-postman.md).

# Azurite's well-known development account. It only works against the emulator
# and is published by Microsoft, so it is not a secret.
x-azurite-connection: &azurite-connection "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: coffeenchill-part2-azurite
    command: >
      azurite
      --skipApiVersionCheck
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --debug /data/debug.log
    ports:
      - "127.0.0.1:11000:10000"
      - "127.0.0.1:11001:10001"
      - "127.0.0.1:11002:10002"
    volumes:
      - coffeenchill-part2-azurite-data:/data
    restart: unless-stopped
    networks:
      - coffeenchill-part2-network

  functions:
    image: ${DOCKERHUB_NAMESPACE:-mandlakazi07}/coffeenchill-functions:${FUNCTIONS_TAG:-part2}
    container_name: coffeenchill-part2-functions
    environment:
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      AzureWebJobsSecretStorageType: "files"
      AzureWebJobsStorage: *azurite-connection
    ports:
      # Localhost only. Clients should go through the gateway.
      - "127.0.0.1:18080:80"
    depends_on:
      - azurite
    restart: unless-stopped
    networks:
      - coffeenchill-part2-network

  gateway:
    image: ${DOCKERHUB_NAMESPACE:-mandlakazi07}/coffeenchill-gateway:${GATEWAY_TAG:-part3}
    container_name: coffeenchill-part3-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__AzureStorage: *azurite-connection
      # Required. Compose stops with this message if .env does not set it.
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env (at least 32 characters, see .env.example)}"
      Jwt__Issuer: "${JWT_ISSUER:-CoffeeNChillGateway}"
      Jwt__Audience: "${JWT_AUDIENCE:-CoffeeNChillClients}"
      # Where the gateway reaches the Functions app inside the Compose network.
      FunctionsApi__BaseUrl: "http://functions:80"
    ports:
      # Public port for Swagger and the API, e.g. http://<vps-ip>:5000/swagger
      - "${GATEWAY_PORT:-5000}:8080"
    depends_on:
      - azurite
      - functions
    restart: unless-stopped
    networks:
      - coffeenchill-part2-network

volumes:
  coffeenchill-part2-azurite-data:

networks:
  coffeenchill-part2-network:
    driver: bridge
