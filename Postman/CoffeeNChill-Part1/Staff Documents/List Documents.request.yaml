$kind: http-request
url: "{{baseUrl}}/api/documents"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Content-Type header exists\", function () {\r

      \    pm.expect(pm.response.headers.has(\"Content-Type\")).to.be.true;\r

      });\r

      \r

      pm.test(\"Downloaded file is not empty\", function () {\r

      \    pm.expect(pm.response.size().body).to.be.above(0);\r

      });"
    language: text/javascript
order: 2000
